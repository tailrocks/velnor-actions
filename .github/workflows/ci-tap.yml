        with:
          name: proof-restore-velnor-tools-${{ github.run_id }}
          path: .velnor-proof/restore/velnor/tools
          if-no-files-found: error
          compression-level: 0

  restore_barrier:
    name: restore barrier
    needs:
      - github_restore
      - velnor_restore
    if: ${{ inputs.benchmark_campaign != '' || inputs.cache_proof_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download github tools restore evidence
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_campaign != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: proof-restore-github-tools-${{ github.run_id }}
          path: .velnor-proof/barrier/github/tools
      - name: Download velnor tools restore evidence
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_campaign != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: proof-restore-velnor-tools-${{ github.run_id }}
          path: .velnor-proof/barrier/velnor/tools
      - name: Verify paired restore evidence and temperature
        shell: bash
        env:
          CACHE_TEMPERATURE: ${{ inputs.cache_temperature }}
          CACHE_PROOF_ID: ${{ inputs.cache_proof_id }}
          BENCHMARK_CACHE_ID: ${{ inputs.benchmark_cache_id }}
        run: |
          set -euo pipefail
          verify_evidence() {
            local root="$1" expected_lane="$2" expected_id="$3" required
            for required in cache.tar archive.sha256 manifest.txt manifest.sha256 hit cache-id lane restore-ms cache-bytes cache-files hit-source age-seconds eviction-risk; do
              [[ -f "${root}/${required}" && ! -L "${root}/${required}" ]] || return 1
            done
            [[ "$(cat "${root}/cache-id")" == "${expected_id}" ]]
            [[ "$(cat "${root}/lane")" == "${expected_lane}" ]]
            [[ "$(cat "${root}/restore-ms")" =~ ^[0-9]+$ ]]
            [[ "$(cat "${root}/cache-bytes")" =~ ^[0-9]+$ ]]
            [[ "$(cat "${root}/cache-files")" =~ ^[0-9]+$ ]]
            [[ "$(cat "${root}/hit-source")" =~ ^(exact|miss)$ ]]
            [[ "$(cat "${root}/age-seconds")" =~ ^-?[0-9]+$ ]]
            [[ "$(cat "${root}/eviction-risk")" =~ ^(low|medium|high|unknown)$ ]]
            [[ "$(sha256sum "${root}/cache.tar" | cut -d' ' -f1)" == "$(cat "${root}/archive.sha256")" ]]
            [[ "$(sha256sum "${root}/manifest.txt" | cut -d' ' -f1)" == "$(cat "${root}/manifest.sha256")" ]]
            local scratch="${root}.verified" mode digest encoded extra path actual_mode
            rm -rf -- "${scratch}"
            mkdir -p -- "${scratch}/tree"
            : > "${scratch}/expected"
            while read -r mode digest encoded extra; do
              [[ -z "${extra}" && "${mode}" =~ ^[0-7]{3,4}$ && "${digest}" =~ ^[0-9a-f]{64}$ && -n "${encoded}" ]]
              path="$(printf '%s' "${encoded}" | openssl base64 -d -A)"
              [[ "$(printf '%s' "${path}" | openssl base64 -A)" == "${encoded}" ]]
              [[ -n "${path}" && "${path}" != /* && "${path}" != *$'\n'* && "/${path}/" != */../* ]]
              printf '%s\n' "${path}" >> "${scratch}/expected"
            done < "${root}/manifest.txt"
            LC_ALL=C sort -u -o "${scratch}/expected" "${scratch}/expected"
            [[ "$(wc -l < "${root}/manifest.txt" | tr -d ' ')" == "$(wc -l < "${scratch}/expected" | tr -d ' ')" ]]
            tar -tf "${root}/cache.tar" | LC_ALL=C sort -u > "${scratch}/actual"
            diff -u "${scratch}/expected" "${scratch}/actual"
            tar -xf "${root}/cache.tar" -C "${scratch}/tree"
            while read -r mode digest encoded extra; do
              path="$(printf '%s' "${encoded}" | openssl base64 -d -A)"
              [[ -f "${scratch}/tree/${path}" && ! -L "${scratch}/tree/${path}" ]]
              actual_mode="$(stat -c '%a' -- "${scratch}/tree/${path}" 2>/dev/null || stat -f '%Lp' -- "${scratch}/tree/${path}")"
              [[ "${actual_mode}" == "${mode}" ]]
              [[ "$(sha256sum -- "${scratch}/tree/${path}" | cut -d' ' -f1)" == "${digest}" ]]
            done < "${root}/manifest.txt"
            rm -rf -- "${scratch}"
          }
          selected=0
          if [[ -n "${CACHE_PROOF_ID}" || -n "${BENCHMARK_CACHE_ID}" ]]; then
            selected=$((selected + 1))
            github='.velnor-proof/barrier/github/tools'
            velnor='.velnor-proof/barrier/velnor/tools'
            verify_evidence "${github}" github 'tools'
            verify_evidence "${velnor}" velnor 'tools'
            test "$(cat "${github}/archive.sha256")" = "$(cat "${velnor}/archive.sha256")"
            test "$(cat "${github}/manifest.sha256")" = "$(cat "${velnor}/manifest.sha256")"
            if [[ -n "${CACHE_PROOF_ID}" ]]; then
              github_hit="$(cat "${github}/hit")"; velnor_hit="$(cat "${velnor}/hit")"
              if [[ "${CACHE_TEMPERATURE}" == cold ]]; then
                [[ "${github_hit}" != true && "${velnor_hit}" != true ]]
              else
                [[ "${github_hit}" == true && "${velnor_hit}" == true ]]
              fi
            fi
          fi
          [[ ${selected} -gt 0 ]] || { echo 'zero applicable cache proof work' >&2; exit 1; }

  reservation_barrier:
    name: Velnor reservation barrier
    needs: restore_barrier
    if: ${{ inputs.benchmark_campaign != '' }}
    runs-on: ${{ 'velnor-trusted' }}
    timeout-minutes: 10
    outputs:
      contract: ${{ steps.reserve.outputs.contract }}
      record_digest: ${{ steps.reserve.outputs.record_digest }}
    steps:
      - name: Validate atomic all-slots-ready reservation
        id: reserve
        shell: bash
        env:
          EXPECTED_OWNER: ${{ github.repository }}
          EXPECTED_CAMPAIGN: ${{ inputs.benchmark_campaign }}
          EXPECTED_WAVE: ${{ inputs.benchmark_wave }}
          EXPECTED_RESERVATION: ${{ inputs.benchmark_reservation }}
          EXPECTED_PARTICIPANTS: ${{ inputs.benchmark_fanout }}
          REQUIRED_PEAK_BYTES: 2147483648
        run: |
          set -euo pipefail
          fail() { echo "reservation contract: $*" >&2; exit 1; }
          record="${VELNOR_BENCHMARK_COORDINATOR_V1-}"
          [[ -n "${record}" ]] || fail "missing coordinator record"
          for number in "${EXPECTED_PARTICIPANTS}" "${REQUIRED_PEAK_BYTES}"; do
            [[ "${number}" =~ ^[1-9][0-9]*$ && ${#number} -le 19 ]] || fail "invalid numeric contract"
          done
          [[ "${EXPECTED_PARTICIPANTS}" == 1 || "${EXPECTED_PARTICIPANTS}" == 8 ]] || fail "participant count must be 1 or 8"
          jq -e 'keys == ["campaign","expires_at_epoch","owner","participant_count","ready_count","reservation_id","schema","slots","state","wave"]' <<<"${record}" >/dev/null || fail "unknown or missing coordinator field"
          jq -e --arg owner "${EXPECTED_OWNER}" --arg campaign "${EXPECTED_CAMPAIGN}" --arg wave "${EXPECTED_WAVE}" --arg reservation "${EXPECTED_RESERVATION}" --argjson count "${EXPECTED_PARTICIPANTS}" --argjson peak "${REQUIRED_PEAK_BYTES}" '
            .schema == 1 and .owner == $owner and .campaign == $campaign and .wave == $wave and
            .reservation_id == $reservation and .state == "released" and
            .participant_count == $count and .ready_count == $count and
            (.expires_at_epoch | type == "number") and
            (.slots | type == "array" and length == $count) and
            ([range(0; $count)] as $expected | ([.slots[].slot] | sort) == $expected) and
            ([.slots[].materialization_id] | length == (unique | length)) and
            (all(.slots[]; (keys == ["materialization_id","reserved_bytes","slot"]) and
              (.materialization_id | type == "string" and test("^[a-z0-9][a-z0-9._:-]{7,127}$")) and
              (.reserved_bytes | type == "number" and . >= $peak)))
          ' <<<"${record}" >/dev/null || fail "coordinator identity, slot set, or peak reservation mismatch"
          expires="$(jq -r '.expires_at_epoch' <<<"${record}")"
          [[ "${expires}" =~ ^[0-9]+$ && "${expires}" -gt "$(date +%s)" ]] || fail "coordinator record expired"
          canonical="$(jq -cS . <<<"${record}")"
          record_digest="$(printf '%s' "${canonical}" | sha256sum | cut -d' ' -f1)"
          printf 'contract=success\nrecord_digest=%s\n' "${record_digest}" >> "${GITHUB_OUTPUT}"

  github_execute:
    name: github execute proof (${{ matrix.slot }})
    needs:
      - validate-request
      - restore_barrier
      - reservation_barrier
      - github_restore
      - velnor_restore
    if: ${{ always() && needs.restore_barrier.result == 'success' && (inputs.cache_proof_id != '' || (inputs.benchmark_campaign != '' && needs.reservation_barrier.result == 'success' && needs.reservation_barrier.outputs.contract == 'success')) }}
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(inputs.benchmark_fanout == '8' && '[0,1,2,3,4,5,6,7]' || '[0]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository into fresh workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download github tools restore artifact
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_campaign != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: proof-restore-github-tools-${{ github.run_id }}
          path: .velnor-proof/execute/github/tools
      - name: Verify and materialize github tools
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_campaign != '' }}
        shell: bash
        run: |
          set -euo pipefail
          verify_evidence() {
            local root="$1" expected_lane="$2" expected_id="$3" required
            for required in cache.tar archive.sha256 manifest.txt manifest.sha256 hit cache-id lane restore-ms cache-bytes cache-files hit-source age-seconds eviction-risk; do
              [[ -f "${root}/${required}" && ! -L "${root}/${required}" ]] || return 1
            done
            [[ "$(cat "${root}/cache-id")" == "${expected_id}" ]]
            [[ "$(cat "${root}/lane")" == "${expected_lane}" ]]
            [[ "$(cat "${root}/restore-ms")" =~ ^[0-9]+$ ]]
            [[ "$(cat "${root}/cache-bytes")" =~ ^[0-9]+$ ]]
            [[ "$(cat "${root}/cache-files")" =~ ^[0-9]+$ ]]
            [[ "$(cat "${root}/hit-source")" =~ ^(exact|miss)$ ]]
            [[ "$(cat "${root}/age-seconds")" =~ ^-?[0-9]+$ ]]
            [[ "$(cat "${root}/eviction-risk")" =~ ^(low|medium|high|unknown)$ ]]
            [[ "$(sha256sum "${root}/cache.tar" | cut -d' ' -f1)" == "$(cat "${root}/archive.sha256")" ]]
            [[ "$(sha256sum "${root}/manifest.txt" | cut -d' ' -f1)" == "$(cat "${root}/manifest.sha256")" ]]
            local scratch="${root}.verified" mode digest encoded extra path actual_mode
            rm -rf -- "${scratch}"
            mkdir -p -- "${scratch}/tree"
            : > "${scratch}/expected"
            while read -r mode digest encoded extra; do
              [[ -z "${extra}" && "${mode}" =~ ^[0-7]{3,4}$ && "${digest}" =~ ^[0-9a-f]{64}$ && -n "${encoded}" ]]
              path="$(printf '%s' "${encoded}" | openssl base64 -d -A)"
              [[ "$(printf '%s' "${path}" | openssl base64 -A)" == "${encoded}" ]]
              [[ -n "${path}" && "${path}" != /* && "${path}" != *$'\n'* && "/${path}/" != */../* ]]
              printf '%s\n' "${path}" >> "${scratch}/expected"
            done < "${root}/manifest.txt"
            LC_ALL=C sort -u -o "${scratch}/expected" "${scratch}/expected"
            [[ "$(wc -l < "${root}/manifest.txt" | tr -d ' ')" == "$(wc -l < "${scratch}/expected" | tr -d ' ')" ]]
            tar -tf "${root}/cache.tar" | LC_ALL=C sort -u > "${scratch}/actual"
            diff -u "${scratch}/expected" "${scratch}/actual"
            tar -xf "${root}/cache.tar" -C "${scratch}/tree"
            while read -r mode digest encoded extra; do
              path="$(printf '%s' "${encoded}" | openssl base64 -d -A)"
              [[ -f "${scratch}/tree/${path}" && ! -L "${scratch}/tree/${path}" ]]
              actual_mode="$(stat -c '%a' -- "${scratch}/tree/${path}" 2>/dev/null || stat -f '%Lp' -- "${scratch}/tree/${path}")"
              [[ "${actual_mode}" == "${mode}" ]]
              [[ "$(sha256sum -- "${scratch}/tree/${path}" | cut -d' ' -f1)" == "${digest}" ]]
            done < "${root}/manifest.txt"
            rm -rf -- "${scratch}"
          }
          root='.velnor-proof/execute/github/tools'
          verify_evidence "${root}" 'github' 'tools'
          copy_started=$(awk '{printf "%d", $1 * 1000}' /proc/uptime)
          tar -xf "${root}/cache.tar" -C .
          copy_finished=$(awk '{printf "%d", $1 * 1000}' /proc/uptime)
          printf '%s\n' "$((copy_finished - copy_started))" > "${root}/copy-ms"
          printf '%s\n' 'github:tools:${{ matrix.slot }}' > "${root}/materialization-id"
      - name: Record portable required-step start
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .velnor-proof/runtime
          [[ -r /proc/uptime && -r /sys/fs/cgroup/cpu.stat && -r /sys/fs/cgroup/memory.peak && -r /sys/fs/cgroup/io.pressure ]]
          monotonic_ms="$(awk '{printf "%d", $1 * 1000}' /proc/uptime)"
          cpu_usec="$(awk '$1 == "usage_usec" {print $2}' /sys/fs/cgroup/cpu.stat)"
          io_total_usec="$(awk '$1 == "some" {for (i=1;i<=NF;i++) if ($i ~ /^total=/) {split($i,a,"="); print a[2]}}' /sys/fs/cgroup/io.pressure)"
          for value in "${monotonic_ms}" "${cpu_usec}" "${io_total_usec}"; do [[ "${value}" =~ ^[0-9]+$ ]]; done
          printf 'START_MONOTONIC_MS=%s\nSTART_CPU_USEC=%s\nSTART_IO_TOTAL_USEC=%s\n' \
            "${monotonic_ms}" "${cpu_usec}" "${io_total_usec}" > .velnor-proof/runtime/start.env
      - name: Set up mise toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: install gate
        uses: tailrocks/velnor-actions/actions/run-gate@3057391f93f3bfc0fe570ee08cfcea9533ea3f92
        with:
          name: install
          command: mise install --locked
      - name: build gate
        uses: tailrocks/velnor-actions/actions/run-gate@3057391f93f3bfc0fe570ee08cfcea9533ea3f92
        with:
          name: build
          command: mise run build
      - name: lint gate
        uses: tailrocks/velnor-actions/actions/run-gate@3057391f93f3bfc0fe570ee08cfcea9533ea3f92
        with:
          name: lint
          command: mise run lint
      - name: format gate
        uses: tailrocks/velnor-actions/actions/run-gate@3057391f93f3bfc0fe570ee08cfcea9533ea3f92
        with:
          name: format
          command: mise run fmt
      - name: Collect portable proof metrics
        shell: bash
        env:
          PROOF_LANE: github
          PROOF_SLOT: ${{ matrix.slot }}
          PROOF_CORRELATION: ${{ needs.validate-request.outputs.correlation }}
        run: |
          set -euo pipefail
          source .velnor-proof/runtime/start.env
          for value in "${START_MONOTONIC_MS}" "${START_CPU_USEC}" "${START_IO_TOTAL_USEC}"; do [[ "${value}" =~ ^[0-9]+$ ]]; done
          end_monotonic_ms="$(awk '{printf "%d", $1 * 1000}' /proc/uptime)"
          end_cpu_usec="$(awk '$1 == "usage_usec" {print $2}' /sys/fs/cgroup/cpu.stat)"
          end_io_total_usec="$(awk '$1 == "some" {for (i=1;i<=NF;i++) if ($i ~ /^total=/) {split($i,a,"="); print a[2]}}' /sys/fs/cgroup/io.pressure)"
          peak_memory_bytes="$(cat /sys/fs/cgroup/memory.peak)"
          disk_bytes="$(du -sb . | awk '{print $1}')"
          for value in "${end_monotonic_ms}" "${end_cpu_usec}" "${end_io_total_usec}" "${peak_memory_bytes}" "${disk_bytes}"; do [[ "${value}" =~ ^[0-9]+$ ]]; done
          (( end_monotonic_ms >= START_MONOTONIC_MS && end_cpu_usec >= START_CPU_USEC && end_io_total_usec >= START_IO_TOTAL_USEC ))
          required_steps_ms=$((end_monotonic_ms - START_MONOTONIC_MS))
          cpu_ms=$(((end_cpu_usec - START_CPU_USEC) / 1000))
          disk_latency_ms=$(((end_io_total_usec - START_IO_TOTAL_USEC) / 1000))
          cache_restore_ms=0; cache_copy_ms=0; cache_lock_wait_ms=0; cache_bytes=0; cache_files=0
          : > .velnor-proof/runtime/hit-sources
          mapfile -d '' -t evidence < <(find ".velnor-proof/execute/${PROOF_LANE}" -mindepth 1 -maxdepth 1 -type d -print0)
          (( ${#evidence[@]} > 0 ))
          for root in "${evidence[@]}"; do
            for field in restore-ms copy-ms cache-bytes cache-files hit-source; do [[ -f "${root}/${field}" ]]; done
            restore="$(cat "${root}/restore-ms")"; copy="$(cat "${root}/copy-ms")"
            bytes="$(cat "${root}/cache-bytes")"; files="$(cat "${root}/cache-files")"
            for value in "${restore}" "${copy}" "${bytes}" "${files}"; do [[ "${value}" =~ ^[0-9]+$ ]]; done
            cache_restore_ms=$((cache_restore_ms + restore)); cache_copy_ms=$((cache_copy_ms + copy))
            cache_bytes=$((cache_bytes + bytes)); cache_files=$((cache_files + files))
            cat "${root}/hit-source" >> .velnor-proof/runtime/hit-sources
          done
          cache_result="$(LC_ALL=C sort -u .velnor-proof/runtime/hit-sources | paste -sd, -)"
          [[ "${cache_result}" =~ ^(exact|miss|exact,miss)$ ]]
          : > .velnor-proof/runtime/output-manifest
          while IFS= read -r -d '' file; do
            [[ "${file}" != *$'\n'* ]]
            digest="$(sha256sum -- "${file}" | cut -d' ' -f1)"
            encoded="$(printf '%s' "${file#./}" | openssl base64 -A)"
            printf '%s %s\n' "${digest}" "${encoded}"
          done < <(find . -path './.git' -prune -o -path './.velnor-proof' -prune -o -type f -print0) | LC_ALL=C sort > .velnor-proof/runtime/output-manifest
          output_digest="$(sha256sum .velnor-proof/runtime/output-manifest | cut -d' ' -f1)"
          correlation="$(printf '%s' "${PROOF_CORRELATION}" | tr -cd 'a-zA-Z0-9._:-')"
          [[ -n "${correlation}" && "${correlation}" == "${PROOF_CORRELATION}" && "${output_digest}" =~ ^[0-9a-f]{64}$ ]]
          psi_cpu="$(tr '\n' ';' < /proc/pressure/cpu)"; psi_io="$(tr '\n' ';' < /proc/pressure/io)"; psi_memory="$(tr '\n' ';' < /proc/pressure/memory)"
          mkdir -p .velnor-proof/metrics
          jq -n --arg lane "${PROOF_LANE}" --argjson slot "${PROOF_SLOT}" \
            --argjson required_steps_ms "${required_steps_ms}" --argjson cpu_ms "${cpu_ms}" \
            --argjson required_step_start_ms "${START_MONOTONIC_MS}" --argjson required_step_end_ms "${end_monotonic_ms}" \
            --argjson peak_memory_bytes "${peak_memory_bytes}" --argjson disk_bytes "${disk_bytes}" \
            --argjson restore_ms "${cache_restore_ms}" --argjson save_ms 0 --argjson copy_ms "${cache_copy_ms}" \
            --argjson lock_wait_ms "${cache_lock_wait_ms}" --argjson disk_latency_ms "${disk_latency_ms}" \
            --arg psi_cpu "${psi_cpu}" --arg psi_io "${psi_io}" --arg psi_memory "${psi_memory}" \
            --arg cache_result "${cache_result}" --argjson cache_bytes "${cache_bytes}" --argjson cache_files "${cache_files}" \
            --arg output_digest "${output_digest}" --arg correlation "${correlation}" \
            '{schema:1,lane:$lane,slot:$slot,required_step_start_ms:$required_step_start_ms,required_step_end_ms:$required_step_end_ms,required_steps_ms:$required_steps_ms,cpu_ms:$cpu_ms,peak_memory_bytes:$peak_memory_bytes,disk_bytes:$disk_bytes,cache_restore_ms:$restore_ms,cache_save_ms:$save_ms,cache_copy_ms:$copy_ms,cache_lock_wait_ms:$lock_wait_ms,disk_latency_ms:$disk_latency_ms,psi:{cpu:$psi_cpu,io:$psi_io,memory:$psi_memory},cache_result:$cache_result,cache_bytes:$cache_bytes,cache_files:$cache_files,output_digest:$output_digest,correlation:$correlation}' \
            > ".velnor-proof/metrics/${PROOF_LANE}-${PROOF_SLOT}.json"
          export METRICS_FILE=".velnor-proof/metrics/${PROOF_LANE}-${PROOF_SLOT}.json"
          export EXPECTED_METRICS_LANE="${PROOF_LANE}" EXPECTED_METRICS_SLOT="${PROOF_SLOT}" EXPECTED_METRICS_CORRELATION="${correlation}"

          set -euo pipefail
          [[ -f "${METRICS_FILE}" && ! -L "${METRICS_FILE}" ]]
          jq -e --arg lane "${EXPECTED_METRICS_LANE}" --argjson slot "${EXPECTED_METRICS_SLOT}" --arg correlation "${EXPECTED_METRICS_CORRELATION}" '
            keys == ["cache_bytes","cache_copy_ms","cache_files","cache_lock_wait_ms","cache_restore_ms","cache_result","cache_save_ms","correlation","cpu_ms","disk_bytes","disk_latency_ms","lane","output_digest","peak_memory_bytes","psi","required_step_end_ms","required_step_start_ms","required_steps_ms","schema","slot"] and
            .schema == 1 and .lane == $lane and .slot == $slot and .correlation == $correlation and
            (.output_digest | type == "string" and test("^[0-9a-f]{64}$")) and
            (.cache_result | type == "string" and test("^(exact|miss|exact,miss)$")) and
            (.psi | keys == ["cpu","io","memory"] and all(.[]; type == "string")) and
            ([.required_step_start_ms,.required_step_end_ms,.required_steps_ms,.cpu_ms,.peak_memory_bytes,.disk_bytes,.cache_restore_ms,.cache_save_ms,.cache_copy_ms,.cache_lock_wait_ms,.disk_latency_ms,.cache_bytes,.cache_files] | all(.[]; type == "number" and . >= 0 and floor == .)) and
            .required_step_end_ms >= .required_step_start_ms and
            .required_steps_ms == (.required_step_end_ms - .required_step_start_ms) and
            ([paths(strings) as $p | getpath($p)] | all(.[]; (test("(?i)(token|secret|password|credential|authorization|/users/|/home/|github_workspace)") | not)))
          ' "${METRICS_FILE}" >/dev/null
      - name: Package github tools post-state
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_campaign != '' }}
        shell: bash
        env:
          CACHE_HIT: post
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          destination='.velnor-proof/post/github/tools'
          rm -rf -- "${destination}"
          mkdir -p -- "${destination}"
          : > "${destination}/files.nul"
          for root in '.cache/mise' '.local/share/mise/installs'; do
            if [[ -e "${root}" ]]; then find "${root}" -type f -print0; fi
          done | LC_ALL=C sort -zu > "${destination}/files.nul"
          : > "${destination}/manifest.txt"
          while IFS= read -r -d '' file; do
            [[ "${file}" != *$'\n'* && "${file}" != /* && "/${file}/" != */../* ]] || { echo 'unsafe cache path' >&2; exit 1; }
            mode="$(stat -c '%a' -- "${file}" 2>/dev/null || stat -f '%Lp' -- "${file}")"
            digest="$(sha256sum -- "${file}" | cut -d' ' -f1)"
            encoded="$(printf '%s' "${file}" | openssl base64 -A)"
            printf '%s %s %s\n' "${mode}" "${digest}" "${encoded}"
          done < "${destination}/files.nul" | LC_ALL=C sort > "${destination}/manifest.txt"
          tar --null --files-from="${destination}/files.nul" --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -cf "${destination}/cache.tar"
          sha256sum "${destination}/manifest.txt" | cut -d' ' -f1 > "${destination}/manifest.sha256"
          sha256sum "${destination}/cache.tar" | cut -d' ' -f1 > "${destination}/archive.sha256"
          restore_started="${RESTORE_STARTED_MS-0}"; restore_finished="${RESTORE_FINISHED_MS-0}"
          for value in "${restore_started}" "${restore_finished}"; do [[ "${value}" =~ ^[0-9]+$ ]]; done
          (( restore_finished >= restore_started ))
          printf '%s\n' "$((restore_finished - restore_started))" > "${destination}/restore-ms"
          stat -c '%s' -- "${destination}/cache.tar" > "${destination}/cache-bytes"
          wc -l < "${destination}/manifest.txt" | tr -d ' ' > "${destination}/cache-files"
          if [[ "${CACHE_HIT}" == true ]]; then printf 'exact\n'; else printf 'miss\n'; fi > "${destination}/hit-source"
          printf '%s\n' '-1' > "${destination}/age-seconds"
          printf '%s\n' 'unknown' > "${destination}/eviction-risk"
          printf '%s\n' "${CACHE_HIT}" > "${destination}/hit"
          printf '%s\n' 'tools' > "${destination}/cache-id"
          printf '%s\n' 'github' > "${destination}/lane"
      - name: Upload execute post-state and metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-post-github-${{ github.run_id }}-${{ matrix.slot }}
          path: |
            .velnor-proof/post/github
            .velnor-proof/metrics
          if-no-files-found: error
          compression-level: 0
      - name: Emit execute contract
        id: aggregate
        uses: tailrocks/velnor-actions/actions/aggregate@3057391f93f3bfc0fe570ee08cfcea9533ea3f92

  velnor_execute:
    name: velnor execute proof (${{ matrix.slot }})
    needs:
      - validate-request
      - restore_barrier
      - reservation_barrier
      - github_restore
      - velnor_restore
    if: ${{ always() && needs.restore_barrier.result == 'success' && (inputs.cache_proof_id != '' || (inputs.benchmark_campaign != '' && needs.reservation_barrier.result == 'success' && needs.reservation_barrier.outputs.contract == 'success')) }}
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(inputs.benchmark_fanout == '8' && '[0,1,2,3,4,5,6,7]' || '[0]') }}
