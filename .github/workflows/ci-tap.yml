          key: ci-v${{ inputs.cache_generation != '' && inputs.cache_generation || '1' }}/tap/tools/${{ runner.os }}-${{ runner.arch }}/${{ hashFiles('mise.lock', 'mise.toml', 'rust-toolchain.toml') }}/${{ hashFiles('mise.lock', 'mise.toml') }}/1e142e6277b12b7e1110478a24caee8f006a9349e86970c890203d6266209463
      - name: Record tools restore boundary
