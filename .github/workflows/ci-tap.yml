          reserved_bytes="$(read_field RESERVED_BYTES)"
          attributed_bytes="$(read_field ATTRIBUTED_BYTES)"
          cleanup_state="$(read_field CLEANUP_STATE)"
          materialization_id="$(read_field MATERIALIZATION_ID)"
