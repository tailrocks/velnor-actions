          destination='.velnor-proof/post/velnor/build-output'
          rm -rf -- "${destination}"
          mkdir -p -- "${destination}"
          : > "${destination}/files.list"
          for root in 'target' '**/target'; do
            if [[ -e "${root}" ]]; then find "${root}" -type f -print; fi
          done | LC_ALL=C sort -u > "${destination}/files.list"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -cf "${destination}/cache.tar" -T "${destination}/files.list"
          sha256sum "${destination}/files.list" | cut -d' ' -f1 > "${destination}/manifest.sha256"
          sha256sum "${destination}/cache.tar" | cut -d' ' -f1 > "${destination}/archive.sha256"
          printf '%s\n' "${CACHE_HIT}" > "${destination}/hit"
          printf '%s\n' 'build-output' > "${destination}/cache-id"
          printf '%s\n' 'velnor' > "${destination}/lane"
      - name: Upload execute post-state and metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-post-velnor-${{ github.run_id }}-${{ matrix.slot }}
          path: |
            .velnor-proof/post/velnor
            .velnor-proof/metrics
          if-no-files-found: error
          compression-level: 0
      - name: Emit execute contract
        id: aggregate
        uses: tailrocks/velnor-actions/actions/aggregate@3057391f93f3bfc0fe570ee08cfcea9533ea3f92

  cache_publish:
    name: sole cache publisher
    needs:
      - restore_barrier
      - github_execute
      - velnor_execute
    if: ${{ (inputs.cache_proof_id != '' && inputs.cache_temperature == 'cold') || (inputs.benchmark_campaign != '' && inputs.benchmark_cache_mode == 'enabled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download deterministic GitHub post-state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: proof-post-github-${{ github.run_id }}-0
          path: .velnor-proof/publish
      - name: Materialize deterministic tools post-state
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_cache_id == 'tools' }}
        shell: bash
        run: |
          set -euo pipefail
          root='.velnor-proof/publish/post/github/tools'
          test "$(sha256sum "${root}/cache.tar" | cut -d' ' -f1)" = "$(cat "${root}/archive.sha256")"
          tar -xf "${root}/cache.tar" -C .
      - name: Publish tools exactly once
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_cache_id == 'tools' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/mise
            .local/share/mise/installs
          key: ci-v${{ inputs.cache_generation != '' && inputs.cache_generation || '1' }}/code/tools/${{ runner.os }}-${{ runner.arch }}/${{ hashFiles('mise.lock', 'mise.toml', 'rust-toolchain.toml') }}/${{ hashFiles('mise.lock', 'mise.toml', 'rust-toolchain.toml') }}/1e142e6277b12b7e1110478a24caee8f006a9349e86970c890203d6266209463
      - name: Materialize deterministic dependencies post-state
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_cache_id == 'dependencies' }}
        shell: bash
        run: |
          set -euo pipefail
          root='.velnor-proof/publish/post/github/dependencies'
          test "$(sha256sum "${root}/cache.tar" | cut -d' ' -f1)" = "$(cat "${root}/archive.sha256")"
          tar -xf "${root}/cache.tar" -C .
      - name: Publish dependencies exactly once
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_cache_id == 'dependencies' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cargo/git
            .cargo/registry
            .gradle/caches
            **/node_modules
          key: ci-v${{ inputs.cache_generation != '' && inputs.cache_generation || '1' }}/code/dependencies/${{ runner.os }}-${{ runner.arch }}/${{ hashFiles('mise.lock', 'mise.toml', 'rust-toolchain.toml') }}/${{ hashFiles('**/.cargo/config.toml', '**/.npmrc', '**/.yarnrc.yml', '**/Cargo.lock', '**/Cargo.toml', '**/build.gradle', '**/build.gradle.kts', '**/bun.lock', '**/bun.lockb', '**/bunfig.toml', '**/gradle.lockfile', '**/gradle.properties', '**/gradle/libs.versions.toml', '**/gradle-wrapper.properties', '**/package-lock.json', '**/package.json', '**/pnpm-lock.yaml', '**/pnpm-workspace.yaml', '**/settings.gradle', '**/settings.gradle.kts', '**/yarn.lock', 'mise.lock', 'mise.toml') }}/44575cf5b28512d75644bf54a517dcef304ff809fd511747621b4d64f19aac66
      - name: Materialize deterministic build-output post-state
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_cache_id == 'build-output' }}
        shell: bash
        run: |
          set -euo pipefail
          root='.velnor-proof/publish/post/github/build-output'
          test "$(sha256sum "${root}/cache.tar" | cut -d' ' -f1)" = "$(cat "${root}/archive.sha256")"
          tar -xf "${root}/cache.tar" -C .
      - name: Publish build-output exactly once
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_cache_id == 'build-output' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            **/target
          key: ci-v${{ inputs.cache_generation != '' && inputs.cache_generation || '1' }}/code/build-output/${{ runner.os }}-${{ runner.arch }}/${{ hashFiles('mise.lock', 'mise.toml', 'rust-toolchain.toml') }}/${{ hashFiles('**/.cargo/config.toml', '**/Cargo.lock', '**/Cargo.toml', 'mise.lock', 'mise.toml', 'rust-toolchain.toml') }}/9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08

  cache-proof-contract:
    name: cache proof contract
    needs:
      - github_restore
      - velnor_restore
      - restore_barrier
      - github_execute
      - velnor_execute
      - cache_publish
    if: ${{ always() && (inputs.benchmark_campaign != '' || inputs.cache_proof_id != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      contract: ${{ steps.contract.outputs.contract }}
    steps:
      - name: Enforce proof DAG contract
        id: contract
        shell: bash
        env:
          GITHUB_RESTORE: ${{ needs.github_restore.result }}
          VELNOR_RESTORE: ${{ needs.velnor_restore.result }}
          RESTORE_BARRIER: ${{ needs.restore_barrier.result }}
          GITHUB_EXECUTE: ${{ needs.github_execute.result }}
          VELNOR_EXECUTE: ${{ needs.velnor_execute.result }}
          CACHE_PUBLISH: ${{ needs.cache_publish.result }}
          TEMPERATURE: ${{ inputs.cache_temperature }}
          BENCHMARK_MODE: ${{ inputs.benchmark_cache_mode }}
        run: |
          set -euo pipefail
          for result in "${GITHUB_RESTORE}" "${VELNOR_RESTORE}" "${RESTORE_BARRIER}" "${GITHUB_EXECUTE}" "${VELNOR_EXECUTE}"; do
            [[ "${result}" == success ]] || { echo "proof DAG result ${result}, expected success" >&2; exit 1; }
          done
          publish_expected=false
          [[ "${TEMPERATURE}" == cold || "${BENCHMARK_MODE}" == enabled ]] && publish_expected=true
          if ${publish_expected}; then
            [[ "${CACHE_PUBLISH}" == success ]] || { echo "cold/enabled proof publisher did not succeed" >&2; exit 1; }
          else
            [[ "${CACHE_PUBLISH}" == skipped ]] || { echo "warm/disabled proof publisher must skip" >&2; exit 1; }
          fi
          echo 'contract=success' >> "${GITHUB_OUTPUT}"

  contract:
    name: contract
    needs:
      - velnor-lane
      - github-lane
      - cache-proof-contract
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      contract: ${{ steps.verdict.outputs.contract }}
    steps:
      - name: Aggregate lane verdict
        id: verdict
        env:
          LANE: ${{ inputs.lane != '' && inputs.lane || (github.repository_owner == 'jackin-project' && 'github') || ((github.repository_owner == 'tailrocks' || github.repository_owner == 'ChainArgos') && 'velnor') || 'invalid' }}
          VELNOR_RESULT: ${{ needs.velnor-lane.result }}
          VELNOR_CONTRACT: ${{ needs.velnor-lane.outputs.contract }}
          GITHUB_RESULT: ${{ needs.github-lane.result }}
          GITHUB_CONTRACT: ${{ needs.github-lane.outputs.contract }}
          PLATFORM_REQUIRED: false
          PLATFORM_RESULT: skipped
          PLATFORM_CONTRACT: ""
          OPERATION: ${{ inputs.benchmark_campaign != '' && 'benchmark' || inputs.cache_proof_id != '' && 'cache-proof' || 'ordinary' }}
          CACHE_PROOF_RESULT: ${{ needs.cache-proof-contract.result }}
          CACHE_PROOF_CONTRACT: ${{ needs.cache-proof-contract.outputs.contract }}
        shell: bash
        run: |
          set -euo pipefail
          # Positive per-lane truth table: emit contract=success ONLY when every selected
          # lane succeeded with contract=success and every non-selected lane is skipped with
          # an empty output. A failed, unavailable, or skipped selected lane is never
          # credited, and one lane never substitutes for the other.
          if [ "${OPERATION}" != ordinary ]; then
            if [ "${CACHE_PROOF_RESULT}" != success ] || [ "${CACHE_PROOF_CONTRACT}" != success ]; then
              echo "contract: ${OPERATION} proof DAG did not pass" >&2
              exit 1
            fi
            if [ "${VELNOR_RESULT}" != skipped ] || [ "${GITHUB_RESULT}" != skipped ] || [ -n "${VELNOR_CONTRACT}${GITHUB_CONTRACT}" ]; then
              echo "contract: ordinary lane jobs ran during ${OPERATION}" >&2
              exit 1
            fi
          else
          case "${LANE}" in
            velnor)
              if [ "${VELNOR_RESULT}" != "success" ] || [ "${VELNOR_CONTRACT}" != "success" ]; then
                echo "contract: velnor lane did not pass (result '${VELNOR_RESULT}', contract '${VELNOR_CONTRACT}')" >&2
                exit 1
              fi
              if [ "${GITHUB_RESULT}" != "skipped" ] || [ -n "${GITHUB_CONTRACT}" ]; then
                echo "contract: github lane must be skipped for lane=velnor (result '${GITHUB_RESULT}')" >&2
                exit 1
              fi
              ;;
            github)
              if [ "${GITHUB_RESULT}" != "success" ] || [ "${GITHUB_CONTRACT}" != "success" ]; then
                echo "contract: github lane did not pass (result '${GITHUB_RESULT}', contract '${GITHUB_CONTRACT}')" >&2
                exit 1
              fi
              if [ "${VELNOR_RESULT}" != "skipped" ] || [ -n "${VELNOR_CONTRACT}" ]; then
                echo "contract: velnor lane must be skipped for lane=github (result '${VELNOR_RESULT}')" >&2
                exit 1
              fi
              ;;
            both)
              if [ "${VELNOR_RESULT}" != "success" ] || [ "${VELNOR_CONTRACT}" != "success" ]; then
                echo "contract: velnor lane did not pass (result '${VELNOR_RESULT}', contract '${VELNOR_CONTRACT}')" >&2
                exit 1
              fi
              if [ "${GITHUB_RESULT}" != "success" ] || [ "${GITHUB_CONTRACT}" != "success" ]; then
                echo "contract: github lane did not pass (result '${GITHUB_RESULT}', contract '${GITHUB_CONTRACT}')" >&2
                exit 1
              fi
              ;;
            *)
              echo "contract: unrecognized lane '${LANE}'" >&2
              exit 1
              ;;
          esac
            if [ "${CACHE_PROOF_RESULT}" != skipped ] || [ -n "${CACHE_PROOF_CONTRACT}" ]; then
              echo "contract: proof DAG ran during ordinary execution" >&2
              exit 1
            fi
          fi
          if [ "${PLATFORM_REQUIRED}" = "true" ]; then
            if [ "${PLATFORM_RESULT}" != "success" ] || [ "${PLATFORM_CONTRACT}" != "success" ]; then
              echo "contract: required GitHub platform lane did not pass" >&2
              exit 1
            fi
          elif [ "${PLATFORM_RESULT}" != "skipped" ] || [ -n "${PLATFORM_CONTRACT}" ]; then
            echo "contract: unexpected GitHub platform lane execution" >&2
            exit 1
          fi
          echo "contract=success" >> "${GITHUB_OUTPUT}"
          echo "contract: lane '${LANE}' passed"
