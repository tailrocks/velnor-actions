            **/target
          key: ci-v${{ inputs.cache_generation != '' && inputs.cache_generation || '1' }}/code/build-output/${{ runner.os }}-${{ runner.arch }}/${{ hashFiles('mise.lock', 'mise.toml', 'rust-toolchain.toml') }}/${{ hashFiles('**/.cargo/config.toml', '**/Cargo.lock', '**/Cargo.toml', 'mise.lock', 'mise.toml', 'rust-toolchain.toml') }}/9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
      - name: Package immutable build-output restore evidence
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_cache_id == 'build-output' }}
        shell: bash
        env:
