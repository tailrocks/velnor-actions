  restore_barrier:
    name: restore barrier
    needs:
      - github_restore
      - velnor_restore
    if: ${{ inputs.benchmark_campaign != '' || inputs.cache_proof_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download github tools restore evidence
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_cache_id == 'tools' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: proof-restore-github-tools-${{ github.run_id }}
          path: .velnor-proof/barrier/github/tools
      - name: Download velnor tools restore evidence
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_cache_id == 'tools' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: proof-restore-velnor-tools-${{ github.run_id }}
          path: .velnor-proof/barrier/velnor/tools
      - name: Download github dependencies restore evidence
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_cache_id == 'dependencies' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: proof-restore-github-dependencies-${{ github.run_id }}
          path: .velnor-proof/barrier/github/dependencies
      - name: Download velnor dependencies restore evidence
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_cache_id == 'dependencies' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: proof-restore-velnor-dependencies-${{ github.run_id }}
          path: .velnor-proof/barrier/velnor/dependencies
      - name: Download github build-output restore evidence
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_cache_id == 'build-output' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: proof-restore-github-build-output-${{ github.run_id }}
          path: .velnor-proof/barrier/github/build-output
      - name: Download velnor build-output restore evidence
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_cache_id == 'build-output' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: proof-restore-velnor-build-output-${{ github.run_id }}
          path: .velnor-proof/barrier/velnor/build-output
      - name: Verify paired restore evidence and temperature
        shell: bash
        env:
          CACHE_TEMPERATURE: ${{ inputs.cache_temperature }}
          CACHE_PROOF_ID: ${{ inputs.cache_proof_id }}
          BENCHMARK_CACHE_ID: ${{ inputs.benchmark_cache_id }}
        run: |
          set -euo pipefail
          selected=0
          if [[ -n "${CACHE_PROOF_ID}" || "${BENCHMARK_CACHE_ID}" == "tools" ]]; then
            selected=$((selected + 1))
            github='.velnor-proof/barrier/github/tools'
            velnor='.velnor-proof/barrier/velnor/tools'
            for root in "${github}" "${velnor}"; do
              test -f "${root}/cache.tar" -a -f "${root}/archive.sha256" -a -f "${root}/manifest.sha256" -a -f "${root}/hit"
              test "$(sha256sum "${root}/cache.tar" | cut -d' ' -f1)" = "$(cat "${root}/archive.sha256")"
            done
            test "$(cat "${github}/archive.sha256")" = "$(cat "${velnor}/archive.sha256")"
            if [[ -n "${CACHE_PROOF_ID}" ]]; then
              github_hit="$(cat "${github}/hit")"; velnor_hit="$(cat "${velnor}/hit")"
              if [[ "${CACHE_TEMPERATURE}" == cold ]]; then
                [[ "${github_hit}" != true && "${velnor_hit}" != true ]]
              else
                [[ "${github_hit}" == true && "${velnor_hit}" == true ]]
              fi
            fi
          fi
          if [[ -n "${CACHE_PROOF_ID}" || "${BENCHMARK_CACHE_ID}" == "dependencies" ]]; then
            selected=$((selected + 1))
            github='.velnor-proof/barrier/github/dependencies'
            velnor='.velnor-proof/barrier/velnor/dependencies'
            for root in "${github}" "${velnor}"; do
              test -f "${root}/cache.tar" -a -f "${root}/archive.sha256" -a -f "${root}/manifest.sha256" -a -f "${root}/hit"
              test "$(sha256sum "${root}/cache.tar" | cut -d' ' -f1)" = "$(cat "${root}/archive.sha256")"
            done
            test "$(cat "${github}/archive.sha256")" = "$(cat "${velnor}/archive.sha256")"
            if [[ -n "${CACHE_PROOF_ID}" ]]; then
              github_hit="$(cat "${github}/hit")"; velnor_hit="$(cat "${velnor}/hit")"
              if [[ "${CACHE_TEMPERATURE}" == cold ]]; then
                [[ "${github_hit}" != true && "${velnor_hit}" != true ]]
              else
                [[ "${github_hit}" == true && "${velnor_hit}" == true ]]
              fi
            fi
          fi
          if [[ -n "${CACHE_PROOF_ID}" || "${BENCHMARK_CACHE_ID}" == "build-output" ]]; then
            selected=$((selected + 1))
            github='.velnor-proof/barrier/github/build-output'
            velnor='.velnor-proof/barrier/velnor/build-output'
            for root in "${github}" "${velnor}"; do
              test -f "${root}/cache.tar" -a -f "${root}/archive.sha256" -a -f "${root}/manifest.sha256" -a -f "${root}/hit"
              test "$(sha256sum "${root}/cache.tar" | cut -d' ' -f1)" = "$(cat "${root}/archive.sha256")"
            done
            test "$(cat "${github}/archive.sha256")" = "$(cat "${velnor}/archive.sha256")"
            if [[ -n "${CACHE_PROOF_ID}" ]]; then
              github_hit="$(cat "${github}/hit")"; velnor_hit="$(cat "${velnor}/hit")"
              if [[ "${CACHE_TEMPERATURE}" == cold ]]; then
                [[ "${github_hit}" != true && "${velnor_hit}" != true ]]
              else
                [[ "${github_hit}" == true && "${velnor_hit}" == true ]]
              fi
            fi
          fi
          [[ ${selected} -gt 0 ]] || { echo 'zero applicable cache proof work' >&2; exit 1; }

  github_execute:
    name: github execute proof (${{ matrix.slot }})
    needs:
      - restore_barrier
      - github_restore
    if: ${{ inputs.benchmark_campaign != '' || inputs.cache_proof_id != '' }}
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(inputs.benchmark_fanout == '8' && '[0,1,2,3,4,5,6,7]' || '[0]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository into fresh workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download github tools restore artifact
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_cache_id == 'tools' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: proof-restore-github-tools-${{ github.run_id }}
          path: .velnor-proof/execute/github/tools
      - name: Verify and materialize github tools
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_cache_id == 'tools' }}
        shell: bash
        run: |
          set -euo pipefail
          root='.velnor-proof/execute/github/tools'
          test "$(sha256sum "${root}/cache.tar" | cut -d' ' -f1)" = "$(cat "${root}/archive.sha256")"
          tar -xf "${root}/cache.tar" -C .
          printf '%s\n' 'github:tools:${{ matrix.slot }}' > "${root}/materialization-id"
      - name: Download github dependencies restore artifact
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_cache_id == 'dependencies' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: proof-restore-github-dependencies-${{ github.run_id }}
          path: .velnor-proof/execute/github/dependencies
      - name: Verify and materialize github dependencies
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_cache_id == 'dependencies' }}
        shell: bash
        run: |
          set -euo pipefail
          root='.velnor-proof/execute/github/dependencies'
          test "$(sha256sum "${root}/cache.tar" | cut -d' ' -f1)" = "$(cat "${root}/archive.sha256")"
          tar -xf "${root}/cache.tar" -C .
          printf '%s\n' 'github:dependencies:${{ matrix.slot }}' > "${root}/materialization-id"
      - name: Download github build-output restore artifact
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_cache_id == 'build-output' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: proof-restore-github-build-output-${{ github.run_id }}
          path: .velnor-proof/execute/github/build-output
      - name: Verify and materialize github build-output
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_cache_id == 'build-output' }}
        shell: bash
        run: |
          set -euo pipefail
          root='.velnor-proof/execute/github/build-output'
          test "$(sha256sum "${root}/cache.tar" | cut -d' ' -f1)" = "$(cat "${root}/archive.sha256")"
          tar -xf "${root}/cache.tar" -C .
          printf '%s\n' 'github:build-output:${{ matrix.slot }}' > "${root}/materialization-id"
      - name: Set up mise toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: install gate
        uses: tailrocks/velnor-actions/actions/run-gate@3057391f93f3bfc0fe570ee08cfcea9533ea3f92
        with:
          name: install
          command: mise install --locked
      - name: build gate
        uses: tailrocks/velnor-actions/actions/run-gate@3057391f93f3bfc0fe570ee08cfcea9533ea3f92
        with:
          name: build
          command: mise run ci
      - name: test gate
        uses: tailrocks/velnor-actions/actions/run-gate@3057391f93f3bfc0fe570ee08cfcea9533ea3f92
        with:
          name: test
          command: mise run test
      - name: lint gate
        uses: tailrocks/velnor-actions/actions/run-gate@3057391f93f3bfc0fe570ee08cfcea9533ea3f92
        with:
          name: lint
          command: mise run lint
      - name: format gate
        uses: tailrocks/velnor-actions/actions/run-gate@3057391f93f3bfc0fe570ee08cfcea9533ea3f92
        with:
          name: format
          command: mise run fmt
      - name: Collect portable proof metrics
        shell: bash
        env:
          PROOF_LANE: github
          PROOF_SLOT: ${{ matrix.slot }}
          PROOF_CORRELATION: ${{ needs.restore_barrier.result }}:${{ inputs.benchmark_campaign }}:${{ inputs.cache_proof_id }}
        run: |
          set -euo pipefail
          mkdir -p .velnor-proof/metrics
          cpu_ms="$(awk '{printf "%d", ($14+$15)*1000/100}' /proc/self/stat 2>/dev/null || printf '0')"
          peak_kib="$(awk '/VmHWM:/ {print $2}' /proc/self/status 2>/dev/null || printf '0')"
          disk_bytes="$(du -sb . 2>/dev/null | awk '{print $1}' || printf '0')"
          psi_cpu="$(tr '\n' ';' < /proc/pressure/cpu 2>/dev/null || true)"
          for value in "${cpu_ms}" "${peak_kib}" "${disk_bytes}"; do [[ "${value}" =~ ^[0-9]+$ ]]; done
          correlation="$(printf '%s' "${PROOF_CORRELATION}" | tr -cd 'a-zA-Z0-9._:-')"
          printf '{"schema":1,"lane":"%s","slot":%s,"cpu_ms":%s,"peak_memory_kib":%s,"disk_bytes":%s,"cache_restore_ms":0,"cache_save_ms":0,"cache_copy_ms":0,"cache_lock_wait_ms":0,"disk_latency_ms":0,"psi_cpu":"%s","cache_result":"proof","cache_bytes":%s,"cache_files":0,"output_digest":"pending","correlation":"%s"}\n' \
            "${PROOF_LANE}" "${PROOF_SLOT}" "${cpu_ms}" "${peak_kib}" "${disk_bytes}" "${psi_cpu}" "${disk_bytes}" "${correlation}" \
            > ".velnor-proof/metrics/${PROOF_LANE}-${PROOF_SLOT}.json"
      - name: Package github tools post-state
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_cache_id == 'tools' }}
        shell: bash
        env:
          CACHE_HIT: post
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          destination='.velnor-proof/post/github/tools'
          rm -rf -- "${destination}"
          mkdir -p -- "${destination}"
          : > "${destination}/files.list"
          for root in '.cache/mise' '.local/share/mise/installs'; do
            if [[ -e "${root}" ]]; then find "${root}" -type f -print; fi
          done | LC_ALL=C sort -u > "${destination}/files.list"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -cf "${destination}/cache.tar" -T "${destination}/files.list"
          sha256sum "${destination}/files.list" | cut -d' ' -f1 > "${destination}/manifest.sha256"
          sha256sum "${destination}/cache.tar" | cut -d' ' -f1 > "${destination}/archive.sha256"
          printf '%s\n' "${CACHE_HIT}" > "${destination}/hit"
          printf '%s\n' 'tools' > "${destination}/cache-id"
          printf '%s\n' 'github' > "${destination}/lane"
      - name: Package github dependencies post-state
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_cache_id == 'dependencies' }}
        shell: bash
        env:
          CACHE_HIT: post
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          destination='.velnor-proof/post/github/dependencies'
          rm -rf -- "${destination}"
          mkdir -p -- "${destination}"
          : > "${destination}/files.list"
          for root in '.cargo/git' '.cargo/registry' '.gradle/caches' '**/node_modules'; do
