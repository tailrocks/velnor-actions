# Class contracts — the shared model each repository class executes. This file is
# DATA. Every class declares an ordered gate list (`[[<class>.gates]]`), each with
# a unique name, an explicit non-empty command, and an explicit applicability,
# plus whether the class carries a genuinely platform-only gate. The generator
# never hardcodes gate names or counts: a class may declare any number of gates
# in any order, as long as the `install` gate — when present — comes first.
#
# Applicability is explicit for every gate; there is no implicit default:
#   both   — lane-portable: runs on the Velnor lane and the GitHub-hosted lane.
#   github — platform-only: runs only on the GitHub-hosted lane (e.g. macOS cask
#            validation). It is NOT run on the Velnor lane and is never
#            misreported there as an equivalent Velnor check.
#
# Members may schedule a subset of their class's gates via `gates = [...]` in
# fleet/repositories.toml (default: every class gate). The fleet task-graph
# linter (crates/velnor-actions-fleetlint) proves each member's scheduled gates
# expand to a mise task DAG with no duplicate leaf execution.

[code]
platform_only = false

[[code.gates]]
name = "install"
command = "mise install --locked"
applicability = "both"

[[code.gates]]
name = "build"
command = "mise run build"
applicability = "both"

[[code.gates]]
name = "test"
command = "mise run test"
applicability = "both"

[[code.gates]]
name = "lint"
command = "mise run lint"
applicability = "both"

[[code.gates]]
name = "format"
command = "mise run fmt"
applicability = "both"

[native]
# Native code keeps the portable code-class contract and adds one required
# macOS-only repository-owned validation gate. The generated workflow remains
# class-driven and never branches on repository slug.
platform_only = true
platform_runner = "macos-26"
platform_name = "native-usage-menu-bar"
platform_timeout_minutes = 60

[[native.gates]]
name = "install"
command = "mise install --locked"
applicability = "both"

[[native.gates]]
name = "build"
command = "mise run build"
applicability = "both"

[[native.gates]]
name = "test"
command = "mise run desktop-ci"
applicability = "github"

[[native.gates]]
name = "lint"
command = "mise run lint"
applicability = "both"

[[native.gates]]
name = "format"
command = "mise run fmt"
applicability = "both"

[tap]
# Homebrew taps carry a genuinely platform-only gate: macOS cask/bottle
# validation cannot run on the Linux Velnor lane, so `test` is declared
# github-only and is legitimately not applicable on the Velnor lane.
platform_only = true
platform_runner = "macos-latest"
platform_name = "GitHub platform lane"

[[tap.gates]]
name = "install"
command = "mise install --locked"
applicability = "both"

[[tap.gates]]
name = "build"
command = "mise run build"
applicability = "both"

[[tap.gates]]
name = "test"
command = "mise run test"
applicability = "github"

[[tap.gates]]
name = "lint"
command = "mise run lint"
applicability = "both"

[[tap.gates]]
name = "format"
command = "mise run fmt"
applicability = "both"

